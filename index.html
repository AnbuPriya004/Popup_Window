<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Motivation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating circles animation -->
    <div class="circles"></div>

    <div class="container">
        <h1 class="title">✨ Daily Motivation ✨</h1>
        <p class="subtitle">Click below to brighten your day!</p>
        <button id="showBtn" class="glow-btn">Show Motivation</button>
    </div>

    <!-- POPUP -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <span id="closeBtn" class="close-btn">&times;</span>

            <img id="motImg" class="mot-img" src="" alt="Motivation Image">

            <h2 class="quote-title">Today's Motivation</h2>
            <p id="quoteText" class="quote"></p>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
